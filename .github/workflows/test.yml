name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # docs-gate: canonical docs-only detector. Inserted by scripts/docs-gate.rb; the
  # `check` mode compares this block byte for byte, so edit it HERE, never per repo.
  # Spec and failure semantics: ~/.claude/skills/ci-setup/specs/docs-only-fastpath.md
  docs-scope:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # docs_only=true only on a positive, complete answer; every doubt means full CI.
          is_doc() {
            case "$1" in
              *.md | docs/* | doc/* | LICENSE | LICENSE.* | LICENSE-* | COPYING | NOTICE | AUTHORS) return 0 ;;
              .github/ISSUE_TEMPLATE/* | .github/PULL_REQUEST_TEMPLATE* | .github/CODEOWNERS) return 0 ;;
            esac
            return 1
          }
          why=
          touched() { # every touched path (rename sources included); non-zero on any doubt
            local url page=1 resp n
            case "$EVENT" in
              pull_request) url="$API/repos/$REPO/pulls/$PR/files" ;;
              push)
                [ -n "${BEFORE//0/}" ] || { why="push without a usable before sha"; return 1; }
                url="$API/repos/$REPO/compare/$BEFORE...$AFTER" ;;
              *) why="event $EVENT"; return 1 ;;
            esac
            while :; do
              resp=$(printf 'header = "Authorization: Bearer %s"\n' "$GH_TOKEN" | curl -fsS --retry 2 -K - -H "Accept: application/vnd.github+json" "$url?per_page=100&page=$page") || { why="API error on page $page"; return 1; }
              if [ "$EVENT" = push ] && [ "$page" = 1 ]; then
                [ "$(jq -r .status <<<"$resp")" = ahead ] || { why="push is not a fast-forward"; return 1; }
              fi
              n=$(jq -r '(if type == "array" then . else .files end) | length' <<<"$resp") || { why="unreadable page $page"; return 1; }
              [[ $n =~ ^[0-9]+$ ]] || { why="unreadable page $page"; return 1; }
              jq -r '(if type == "array" then . else .files end) | .[] | .filename, (.previous_filename // empty)' <<<"$resp" || { why="unreadable page $page"; return 1; }
              # compare lists at most 300 files: 300 or more may be a truncated list
              if [ "$EVENT" = push ] && [ "$n" -ge 100 ]; then why="push may exceed the compare file cap"; [ "$page" -lt 3 ] || return 1; fi
              [ "$n" -ge 100 ] || { why=; return 0; }
              page=$((page + 1))
              [ "$page" -le 30 ] || { why="3000 files or more"; return 1; }
            done
          }
          docs_only=false
          # `if !` keeps errexit off for the whole listing: every doubt is an explicit return 1
          if ! list=$(touched); then
            why=${why:-listing failed}
          elif [ -z "$list" ]; then
            why="no changed paths"
          else
            docs_only=true
            while IFS= read -r f; do is_doc "$f" || { docs_only=false; why="code path: $f"; break; }; done <<<"$list"
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs-only: $docs_only${why:+ ($why)}" >> "$GITHUB_STEP_SUMMARY"

  phpunit:
    needs: [docs-scope]
    if: ${{ !cancelled() && !(needs.docs-scope.result == 'success' && needs.docs-scope.outputs.docs_only == 'true') }}
    name: PHPUnit ${{ matrix.php }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # #47: imagick + gd needed for the AVIF/WebP encode tests.
          # shivammathur/setup-php's Imagick build includes the AVIF
          # (libheif) delegate on ubuntu-24.04.
          extensions: mbstring, xml, curl, imagick, gd
          coverage: xdebug
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-php-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Verify AVIF encode capability
        # #63 review: supportsAvif() now does a REAL 2x2 encode probe
        # (not queryFormats read-check), so this gate is honest — if the
        # runner has NO avif writer at all (neither Imagick-write nor
        # GD-imageavif), the build FAILS loudly (no synthetic green).
        # The diagnostic below prints the full capability matrix so the
        # log shows exactly which writer is available (or none). Do NOT
        # weaken the real-encode test to skip — a missing writer is the
        # correct signal to provision an apt av1 delegate.
        run: |
          php -r '
            require __DIR__ . "/vendor/autoload.php";

            // Diagnostic: print the full AVIF capability matrix.
            echo "=== AVIF capability matrix ===" . PHP_EOL;

            // 1. Imagick read-side (queryFormats — "format known", NOT "encode works").
            $imagickRead = "no";
            if (extension_loaded("imagick")) {
              try {
                $imagickRead = \Imagick::queryFormats("AVIF") !== [] ? "YES" : "no";
              } catch (\Throwable $e) { $imagickRead = "no (threw)"; }
            }
            echo "imagick-read  (queryFormats AVIF): {$imagickRead}" . PHP_EOL;

            // 2. Imagick write-side (real 2x2 getImageBlob in try/catch).
            $imagickWrite = "no";
            if (extension_loaded("imagick")) {
              try {
                $img = new \Imagick();
                $img->newImage(2, 2, new \ImagickPixel("white"));
                $img->setImageFormat("AVIF");
                $blob = $img->getImageBlob();
                $img->clear();
                $imagickWrite = $blob !== "" ? "YES" : "no (empty blob)";
              } catch (\Throwable $e) { $imagickWrite = "no (threw: " . get_class($e) . ")"; }
            }
            echo "imagick-write (real 2x2 encode):   {$imagickWrite}" . PHP_EOL;

            // 3. GD imageavif (function_exists + a real 2x2 encode).
            $gdAvif = "no";
            if (function_exists("imageavif")) {
              try {
                $im = imagecreatetruecolor(2, 2);
                ob_start();
                $ok = imageavif($im, null, 50);
                $bytes = ob_get_clean();
                imagedestroy($im);
                if ($ok === false || $bytes === false || $bytes === "") {
                  $gdAvif = "no (empty/false output)";
                } else {
                  $gdAvif = "YES";
                }
              } catch (\Throwable $e) { $gdAvif = "no (threw: " . get_class($e) . ")"; }
            }
            echo "gd-imageavif (function_exists+encode): {$gdAvif}" . PHP_EOL;
            echo "===============================" . PHP_EOL;

            $t = new OXPulse\Imager\Infrastructure\Image\ImageTransformer();
            if (!$t->supportsAvif()) {
              echo "::error::supportsAvif() is false — no AVIF writer on the runner (see matrix above). The real-encode test will FAIL (by design — no synthetic green). Provision an apt av1 delegate or a GD build with imageavif." . PHP_EOL;
              exit(1);
            }
            echo "✓ supportsAvif() = true — AVIF encode tests will run." . PHP_EOL;
          '

      - name: Run unit tests
        run: composer test:unit
        env:
          WP_TESTS_DIR: ''

      - name: Run integration suite
        # #126: the integration suite (hook-wiring falsification tests
        # included) must GATE — a filter that stops being registered
        # otherwise ships behind a green unit-only gate.
        run: composer test:integration
        env:
          WP_TESTS_DIR: ''

      - name: Lint main plugin file
        run: php -l oxpulse-imager.php

  admin-build:
    needs: [docs-scope]
    if: ${{ !cancelled() && !(needs.docs-scope.result == 'success' && needs.docs-scope.outputs.docs_only == 'true') }}
    name: Admin SPA build + JS tests
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run JS tests
        run: npm test

      - name: Build admin SPA
        run: npm run build

      - name: Verify deterministic build (rebuild → identical hashes)
        run: |
          FIRST_HASH=$(cat assets/manifest.json | sha256sum)
          npm run build
          SECOND_HASH=$(cat assets/manifest.json | sha256sum)
          if [ "$FIRST_HASH" != "$SECOND_HASH" ]; then
            echo "::error::Build is not deterministic — two consecutive builds produced different manifest.json"
            echo "First:  $FIRST_HASH"
            echo "Second: $SECOND_HASH"
            exit 1
          fi
          echo "✓ Deterministic build verified"

      - name: Verify committed assets match build output
        run: |
          # The committed assets/manifest.json + hashed files MUST match
          # what a fresh build produces — catches a developer who built
          # locally but forgot to commit the new assets.
          git diff --exit-code assets/manifest.json || {
            echo "::error::assets/manifest.json is out of date — run 'npm run build' and commit the result"
            exit 1
          }
          git diff --exit-code assets/js/ assets/css/ || {
            echo "::error::assets/js or assets/css is out of date — run 'npm run build' and commit the result"
            exit 1
          }

      - name: Verify .pot file is up to date
        run: |
          npm run make-pot
          git diff --exit-code languages/oxpulse-imager.pot || {
            echo "::error::languages/oxpulse-imager.pot is out of date — run 'npm run make-pot' and commit the result"
            exit 1
          }

  plugin-check:
    needs: [docs-scope]
    if: ${{ !cancelled() && !(needs.docs-scope.result == 'success' && needs.docs-scope.outputs.docs_only == 'true') }}
    name: WordPress Plugin Check
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1.1.7
        with:
          build-dir: '.'
          exclude-files: |
            .gitignore
            .gitattributes
            .editorconfig
            .gitleaksignore
            .release-please-manifest.json
            release-please-config.json
            phpunit.xml.dist
            .phpunit.result.cache
            ROADMAP.md
            CHANGELOG.md
            SECURITY.md
            README.md
          exclude-directories: |
            node_modules
            vendor
            tests
            build
            .github
            .git
            freemius
          # Legitimate false positives (reviewed):
          # - ExceptionNotEscaped : exception messages are not HTML output.
          # - parse_url_parse_url : Domain/Application layer (UrlRewriter,
          #   HealthCheckService) intentionally uses PHP primitives, not WP
          #   wrappers — this layer must be WordPress-agnostic for testability.
          ignore-codes: |
            WordPress.Security.EscapeOutput.ExceptionNotEscaped
            WordPress.WP.AlternativeFunctions.parse_url_parse_url
          ignore-warnings: false
